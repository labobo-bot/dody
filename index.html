<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>تطبيق دردشة دودي</title>
    
    <meta name="description" content="دردشة دودي للدردشة الذكية والغرف التفاعلية والرسائل الخاصة">
    
    <!-- رابط الأيقونة الفاخرة لتطبيقك -->
    <link rel="icon" type="image/png" href="https://ibb.co">
    
    <!-- كود توثيق جوجل المعتمد والناجح 100% بدون أي حذف -->
    <meta name="google-site-verification" content="ZCf6C8GE7PyEWF_WMUSP6P3VoHbszrjP5SGlctzPr_Q" />
    
    <!-- سطر التحويل السحري الموجه مباشرة لسيرفرك الشغال 100% بدون شاشات زرقاء -->
    <meta http-equiv="refresh" content="0; url=https://run.app" />

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0f172a;
            font-family: Arial, sans-serif;
            color: white;
        }
        .loader {
            border: 4px solid #1e293b;
            border-top: 4px solid #fbbf24;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <div class="loader" style="position: absolute;"></div>
    
    <!-- تم تصحيح المسار بنقطة واحدة ليتوافق مع نظام Vite ويختفي الأحمر فوراً -->
    <script type="module" src="./src/main.tsx"></script>
</body>
</html>
